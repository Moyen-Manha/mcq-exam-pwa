<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamPrep SSC-27 - শিক্ষার্থী পোর্টাল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold">ExamPrep SSC-27</h1>
            <span id="userStatus" class="text-xs bg-blue-700 px-2.5 py-1 rounded-full text-blue-100">গেস্ট</span>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full px-4 py-6 flex-grow">

        <div id="authTabs" class="flex bg-slate-200 p-1 rounded-xl mb-6">
            <button onclick="switchTab('pay')" id="tabPay" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow text-blue-600">নতুন পেমেন্ট</button>
            <button onclick="switchTab('login')" id="tabLogin" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600">লগইন (পরীক্ষা দিন)</button>
        </div>

        <!-- Payment -->
        <div id="paymentSection" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
            <h2 class="text-xl font-bold mb-4">মডেল টেস্ট ২০২৭ প্যাকেজ</h2>
            <p class="text-xs text-slate-600 mb-4">বিকাশ/নগদ: <span class="font-bold">01722166666</span> (Send Money)</p>
            <form onsubmit="submitPayment(event)" class="space-y-3">
                <input type="text" id="userName" required placeholder="আপনার নাম" class="w-full p-2.5 border rounded-xl text-sm">
                <input type="tel" id="userPhone" required placeholder="মোবাইল নম্বর" class="w-full p-2.5 border rounded-xl text-sm">
                <input type="text" id="trxId" required placeholder="TrxID" class="w-full p-2.5 border rounded-xl text-sm">
                <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-bold text-sm">সাবমিট করুন</button>
            </form>
        </div>

        <!-- Login -->
        <div id="loginSection" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
            <h2 class="text-xl font-bold mb-4">শিক্ষার্থী লগইন</h2>
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <input type="tel" id="loginPhone" required placeholder="মোবাইল নম্বর" class="w-full p-2.5 border rounded-xl text-sm">
                <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-bold text-sm">লগইন করুন</button>
            </form>
        </div>

        <!-- Dashboard with Multi-Select Checkboxes -->
        <div id="examDashboard" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <h2 id="welcomeText" class="font-bold text-slate-900 text-lg">মডেল টেস্ট - ২০২৭</h2>
                <p class="text-xs text-emerald-600 font-bold mt-1">অংশগ্রহণের জন্য বিষয়গুলো বেছে নিন:</p>
            </div>

            <div class="bg-emerald-50/50 border border-emerald-100 rounded-2xl p-4 space-y-3">
                <p class="text-xs font-bold text-emerald-900 border-b border-emerald-100 pb-2">যেকোনো ৩টি বিষয় বেছে নিন:</p>
                <div id="subjectCheckboxContainer" class="space-y-2.5">
                    <p class="text-xs text-slate-400">বিষয় লোড হচ্ছে...</p>
                </div>
            </div>

            <button onclick="startMultiExam()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition text-sm shadow-md">
                পরীক্ষা শুরু করুন
            </button>
        </div>

        <!-- Live MCQ Exam -->
        <div id="mcqScreen" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-100">
                <div>
                    <span id="questionCount" class="text-xs font-bold text-blue-600 block">প্রশ্ন ১/১</span>
                    <span id="activeSubjectTitle" class="text-xs text-slate-500 font-medium">পরীক্ষা</span>
                </div>
                <span id="timerText" class="text-xs text-red-500 font-bold bg-red-50 px-3 py-1 rounded-full border border-red-100">⏱️ 00:00</span>
            </div>
            <div id="questionContainer" class="space-y-4"></div>
            <button onclick="nextQuestion()" class="w-full mt-6 bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition text-sm">
                পরবর্তী প্রশ্ন
            </button>
        </div>

        <!-- Result -->
        <div id="resultScreen" class="hidden bg-white rounded-2xl p-6 shadow-sm border border-slate-100 text-center">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">🏆</div>
            <h2 class="text-2xl font-bold text-slate-900">পরীক্ষা সম্পন্ন!</h2>
            <div class="bg-slate-50 p-4 rounded-xl my-6">
                <span class="text-xs text-slate-500 block mb-1">প্রাপ্ত নম্বর</span>
                <span id="scoreText" class="text-3xl font-extrabold text-blue-600">০/০</span>
            </div>
            <button onclick="location.reload()" class="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl text-sm">ড্যাশবোর্ডে ফিরুন</button>
        </div>

    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBbN4F7Ys23miaMZZR9Xf8NCgBahsTw6BI",
            authDomain: "mcqexm.firebaseapp.com",
            projectId: "mcqexm",
            storageBucket: "mcqexm.firebasestorage.app",
            messagingSenderId: "232482881612",
            appId: "1:232482881612:web:dc976b8f66e03c2480b4e9",
            measurementId: "G-5W6KJQZWW8"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function switchTab(type) {
            if(type === 'pay') {
                document.getElementById('paymentSection').classList.remove('hidden');
                document.getElementById('loginSection').classList.add('hidden');
            } else {
                document.getElementById('paymentSection').classList.add('hidden');
                document.getElementById('loginSection').classList.remove('hidden');
            }
        }

        async function submitPayment(e) {
            e.preventDefault();
            const phone = document.getElementById('userPhone').value.trim();
            await db.collection('students').doc(phone).set({
                name: document.getElementById('userName').value.trim(),
                phone: phone,
                trxId: document.getElementById('trxId').value.trim(),
                status: 'pending'
            });
            alert("পেমেন্ট জমা হয়েছে!");
            switchTab('login');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const docRef = await db.collection('students').doc(phone).get();
            
            if(!docRef.exists) return alert("আবেদন পাওয়া যায়নি!");
            const data = docRef.data();

            if(data.status === 'approved') {
                document.getElementById('authTabs').classList.add('hidden');
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('examDashboard').classList.remove('hidden');
                loadSubjectCheckboxes();
            } else {
                alert("আপনার পেমেন্ট অপেক্ষমাণ (Pending) বা বাতিল করা হয়েছে।");
            }
        }

        let allExamsData = {};

        function loadSubjectCheckboxes() {
            const container = document.getElementById('subjectCheckboxContainer');
            db.collection('exams').get().then(snapshot => {
                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allExamsData[doc.id] = data;
                    html += `
                        <label class="flex items-center justify-between p-3.5 bg-white border border-emerald-100 rounded-xl cursor-pointer hover:border-emerald-300 transition shadow-sm">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" value="${doc.id}" class="subject-checkbox w-4 h-4 text-emerald-600 rounded">
                                <span class="font-bold text-xs text-slate-800">${data.title}</span>
                            </div>
                            <span class="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2 py-1 rounded-lg">${data.timeLimit || 25} মিনিট</span>
                        </label>
                    `;
                });
                container.innerHTML = html || "<p class='text-xs text-slate-400'>কোনো বিষয় নেই।</p>";
            });
        }

        // Shuffle questions so every student gets different order
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let currentQuestions = [];
        let currentQIndex = 0, obtainedScore = 0;
        let timerInterval, totalSeconds = 0;

        function startMultiExam() {
            const checkboxes = document.querySelectorAll('.subject-checkbox:checked');
            if(checkboxes.length === 0) return alert("কমপক্ষে একটি বিষয় বেছে নিন!");

            currentQuestions = [];
            totalSeconds = 0;

            checkboxes.forEach(cb => {
                const exam = allExamsData[cb.value];
                if(exam && exam.questions) {
                    currentQuestions.push(...exam.questions);
                    totalSeconds += (exam.timeLimit || 25) * 60;
                }
            });

            if(currentQuestions.length === 0) return alert("সিলেক্ট করা বিষয়ে প্রশ্ন নেই!");

            // Shuffle questions for each student dynamically
            currentQuestions = shuffleArray(currentQuestions);

            currentQIndex = 0; obtainedScore = 0;
            document.getElementById('examDashboard').classList.add('hidden');
            document.getElementById('mcqScreen').classList.remove('hidden');

            startTimer();
            renderQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                totalSeconds--;
                const mins = Math.floor(totalSeconds / 60);
                const secs = totalSeconds % 60;
                document.getElementById('timerText').innerText = `⏱️ ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if(totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert("সময় শেষ!");
                    showResult();
                }
            }, 1000);
        }

        function renderQuestion() {
            const q = currentQuestions[currentQIndex];
            document.getElementById('questionCount').innerText = `প্রশ্ন ${currentQIndex + 1}/${currentQuestions.length}`;
            
            let html = `<h3 class="font-bold text-slate-800 mb-3 text-xs leading-relaxed">${q.q}</h3><div class="space-y-2">`;
            q.options.forEach((opt, idx) => {
                html += `<label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50">
                    <input type="radio" name="option" value="${idx}"> <span class="text-xs text-slate-700">${opt}</span>
                </label>`;
            });
            document.getElementById('questionContainer').innerHTML = html + `</div>`;
        }

        function nextQuestion() {
            const selected = document.querySelector('input[name="option"]:checked');
            if (!selected) return alert("উত্তর বেছে নিন!");
            if (parseInt(selected.value) === currentQuestions[currentQIndex].ans) obtainedScore++;
            currentQIndex++;
            if (currentQIndex < currentQuestions.length) renderQuestion();
            else showResult();
        }

        function showResult() {
            clearInterval(timerInterval);
            document.getElementById('mcqScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            document.getElementById('scoreText').innerText = `${obtainedScore}/${currentQuestions.length}`;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamPrep SSC-27 - এডমিন প্যানেল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl p-6 shadow-md space-y-8">
        
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-2xl font-bold text-slate-800">ExamPrep এডমিন কন্ট্রোল প্যানেল (SSC 2027)</h1>
        </div>

        <!-- PIN Protection -->
        <div id="pinBox" class="space-y-3">
            <p class="text-sm text-slate-600">এডমিন পেজে ঢুকতে গোপন পিন লিখুন:</p>
            <input type="password" id="adminPin" placeholder="পিন লিখুন (Default: 1234)" class="w-full p-2.5 border rounded-xl text-sm">
            <button onclick="loginAdmin()" class="bg-blue-600 text-white text-sm px-4 py-2 rounded-xl font-bold">প্রবেশ করুন</button>
        </div>

        <!-- Dashboard -->
        <div id="adminContent" class="hidden space-y-8">

            <div class="flex bg-slate-100 p-1 rounded-xl">
                <button onclick="switchAdminTab('students')" id="tabStudentsBtn" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow">পেমেন্ট রিকোয়েস্ট</button>
                <button onclick="switchAdminTab('questions')" id="tabQuestionsBtn" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600">গুগল শীট সিঙ্ক</button>
            </div>

            <!-- Tab 1: Student Requests -->
            <div id="tabStudentsSection" class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-slate-700">আবেদনকারীদের তালিকা</h2>
                    <button onclick="loadStudents()" class="bg-blue-100 text-blue-700 text-xs px-3 py-1.5 rounded-lg font-bold">রিফ্রেশ করুন</button>
                </div>
                <div id="studentList" class="space-y-3">
                    <p class="text-xs text-slate-400">লোডিং...</p>
                </div>
            </div>

            <!-- Tab 2: Sync Questions from 2 Sheets -->
            <div id="tabQuestionsSection" class="hidden space-y-6">
                <h2 class="font-bold text-slate-700 text-lg border-b pb-2">গুগল শীট (Sets & Questions CSV) থেকে সিঙ্ক করুন</h2>
                
                <form onsubmit="syncGoogleSheet(event)" class="space-y-4 bg-slate-50 p-4 rounded-xl border">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">১ম শীট CSV URL (Sets Info - বিষয়, সময়, মার্ক্স)</label>
                        <input type="url" id="setsUrl" required placeholder="১ম ট্যাবের CSV লিংক দিন" class="w-full p-2.5 border rounded-xl text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">২য় শীট CSV URL (Questions Info - প্রশ্ন ও অপশনসমূহ)</label>
                        <input type="url" id="questionsUrl" required placeholder="২য় ট্যাবের CSV লিংক দিন" class="w-full p-2.5 border rounded-xl text-sm">
                    </div>

                    <button type="submit" id="btnSync" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-blue-700 transition">
                        সব বিষয় ও প্রশ্ন ডাটাবেজে সিঙ্ক করুন
                    </button>
                </form>

                <div class="mt-6">
                    <h3 class="font-bold text-slate-700 text-sm mb-3">ডাটাবেজে থাকা পরীক্ষার বিষয়সমূহ</h3>
                    <div id="examList" class="space-y-3">
                        <p class="text-xs text-slate-400">লোডিং...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBbN4F7Ys23miaMZZR9Xf8NCgBahsTw6BI",
            authDomain: "mcqexm.firebaseapp.com",
            projectId: "mcqexm",
            storageBucket: "mcqexm.firebasestorage.app",
            messagingSenderId: "232482881612",
            appId: "1:232482881612:web:dc976b8f66e03c2480b4e9",
            measurementId: "G-5W6KJQZWW8"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function loginAdmin() {
            const pin = document.getElementById('adminPin').value;
            if(pin === '1234') {
                document.getElementById('pinBox').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                loadStudents();
                loadExams();
            } else {
                alert("ভুল পিন নম্বর!");
            }
        }

        function switchAdminTab(type) {
            if(type === 'students') {
                document.getElementById('tabStudentsSection').classList.remove('hidden');
                document.getElementById('tabQuestionsSection').classList.add('hidden');
                document.getElementById('tabStudentsBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow";
                document.getElementById('tabQuestionsBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600";
            } else {
                document.getElementById('tabStudentsSection').classList.add('hidden');
                document.getElementById('tabQuestionsSection').classList.remove('hidden');
                document.getElementById('tabQuestionsBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow";
                document.getElementById('tabStudentsBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600";
            }
        }

        function loadStudents() {
            const list = document.getElementById('studentList');
            list.innerHTML = "<p class='text-xs text-slate-400'>ডাটা লোড হচ্ছে...</p>";

            db.collection('students').get().then(snapshot => {
                if(snapshot.empty) {
                    list.innerHTML = "<p class='text-xs text-slate-500'>কোনো আবেদন পাওয়া যায়নি।</p>";
                    return;
                }

                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const docId = doc.id;
                    const status = data.status || 'pending';
                    let statusBadge = status === 'approved' 
                        ? '<span class="bg-green-100 text-green-700 text-xs px-2.5 py-1 rounded-full font-bold">Approved</span>' 
                        : (status === 'rejected' ? '<span class="bg-red-100 text-red-700 text-xs px-2.5 py-1 rounded-full font-bold">Rejected</span>' : '<span class="bg-amber-100 text-amber-700 text-xs px-2.5 py-1 rounded-full font-bold">Pending</span>');

                    html += `
                        <div class="border p-4 rounded-xl flex items-center justify-between bg-slate-50 shadow-sm">
                            <div>
                                <h3 class="font-bold text-sm text-slate-800">${data.name || 'নাম নেই'} &nbsp; ${statusBadge}</h3>
                                <p class="text-xs text-slate-600 mt-1">ফোন: <span class="font-semibold">${data.phone || docId}</span></p>
                                <p class="text-xs text-blue-600 font-mono mt-0.5">TrxID: ${data.trxId || 'নেই'}</p>
                            </div>
                            <div class="flex gap-2">
                                ${status === 'pending' ? `
                                    <button onclick="updateStatus('${docId}', 'approved')" class="bg-green-600 text-white text-xs px-3 py-2 rounded-lg font-bold hover:bg-green-700">Approve</button>
                                    <button onclick="updateStatus('${docId}', 'rejected')" class="bg-red-600 text-white text-xs px-3 py-2 rounded-lg font-bold hover:bg-red-700">Reject</button>
                                ` : `
                                    <button onclick="updateStatus('${docId}', 'pending')" class="bg-slate-300 text-slate-700 text-xs px-3 py-2 rounded-lg font-semibold">Reset</button>
                                `}
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            });
        }

        function updateStatus(docId, status) {
            db.collection('students').doc(docId).update({ status: status }).then(() => {
                alert("স্ট্যাটাস সফলভাবে আপডেট করা হয়েছে!");
                loadStudents();
            });
        }

        // Fetch CSV using AllOrigins CORS proxy
        async function fetchCSV(rawUrl) {
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rawUrl)}`;
            const res = await fetch(proxyUrl);
            if (!res.ok) throw new Error("CORS Proxy দিয়ে ডাটা আনতে সমস্যা হয়েছে।");
            const data = await res.json();
            return data.contents;
        }

        function parseCSVRows(text) {
            const lines = text.split(/\r?\n/);
            return lines.map(line => {
                if(!line.trim()) return null;
                const matches = line.match(/(".*?"|[^",\r\n]+)(?=\s*,|\s*$)/g) || [];
                return matches.map(v => v.replace(/^"|"$/g, '').trim());
            }).filter(Boolean);
        }

        async function syncGoogleSheet(e) {
            e.preventDefault();
            const setsUrl = document.getElementById('setsUrl').value.trim();
            const questionsUrl = document.getElementById('questionsUrl').value.trim();
            const btn = document.getElementById('btnSync');

            btn.disabled = true;
            btn.innerText = "সিঙ্ক হচ্ছে...";

            try {
                const [setsCsv, questionsCsv] = await Promise.all([
                    fetchCSV(setsUrl),
                    fetchCSV(questionsUrl)
                ]);

                const setsRows = parseCSVRows(setsCsv);
                const questionsRows = parseCSVRows(questionsCsv);

                // Parse Sets (Sheet 1)
                const setsMap = {};
                for(let i = 1; i < setsRows.length; i++) {
                    const row = setsRows[i];
                    if(row && row.length >= 2) {
                        const setNo = row[0];
                        setsMap[setNo] = {
                            setNo: setNo,
                            title: row[1],
                            timeLimit: parseInt(row[2]) || 25,
                            marksPerQ: parseFloat(row[3]) || 1,
                            questions: []
                        };
                    }
                }

                // Parse Questions (Sheet 2) and map to Sets
                for(let i = 1; i < questionsRows.length; i++) {
                    const row = questionsRows[i];
                    if(row && row.length >= 8) {
                        const setN = row[0];
                        if(setsMap[setN]) {
                            setsMap[setN].questions.push({
                                q: row[1],
                                imgUrl: row[2] || '',
                                options: [row[3], row[4], row[5], row[6]],
                                ans: (parseInt(row[7]) || 1) - 1 // 1-4 to 0-3
                            });
                        }
                    }
                }

                if(Object.keys(setsMap).length === 0) {
                    alert("শীট থেকে কোনো তথ্য পাওয়া যায়নি! গুগল শীটের ফরম্যাট ঠিক আছে কিনা নিশ্চিত করুন।");
                    return;
                }

                // Batch upload to Firestore
                const batch = db.batch();
                Object.keys(setsMap).forEach(key => {
                    const setObj = setsMap[key];
                    const docRef = db.collection('exams').doc(`set_${setObj.setNo}`);
                    batch.set(docRef, setObj);
                });

                await batch.commit();
                alert("সাফল্যের সাথে সব বিষয়, সময় ও প্রশ্ন ফায়ারবেসে সিঙ্ক হয়েছে!");
                loadExams();
            } catch (err) {
                alert("ত্রুটি: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "সব বিষয় ও প্রশ্ন ডাটাবেজে সিঙ্ক করুন";
            }
        }

        function loadExams() {
            const list = document.getElementById('examList');
            db.collection('exams').get().then(snapshot => {
                if(snapshot.empty) {
                    list.innerHTML = "<p class='text-xs text-slate-400'>কোনো বিষয় সিঙ্ক করা হয়নি।</p>";
                    return;
                }
                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const qCount = data.questions ? data.questions.length : 0;
                    html += `
                        <div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-xs">
                            <div>
                                <span class="font-bold text-slate-800 text-sm">${data.title} (Set: ${data.setNo})</span>
                                <p class="text-slate-500 mt-0.5">সময়: ${data.timeLimit} মিনিট | প্রশ্ন: ${qCount} টি | নম্বর/প্রশ্ন: ${data.marksPerQ}</p>
                            </div>
                            <button onclick="deleteExam('${doc.id}')" class="text-red-500 hover:underline font-bold">মুছে ফেলুন</button>
                        </div>
                    `;
                });
                list.innerHTML = html;
            });
        }

        function deleteExam(id) {
            if(confirm("আপনি কি এই বিষয় ও প্রশ্নগুলো মুছে ফেলতে চান?")) {
                db.collection('exams').doc(id).delete().then(() => loadExams());
            }
        }
    </script>
</body>
</html>

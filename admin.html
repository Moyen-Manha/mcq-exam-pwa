<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamPrep SSC-27 - AI এডমিন প্যানেল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl p-6 shadow-md space-y-8">
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-2xl font-bold text-slate-800">ExamPrep AI এডমিন প্যানেল (SSC 2027)</h1>
        </div>

        <!-- PIN Protection -->
        <div id="pinBox" class="space-y-3">
            <p class="text-sm text-slate-600">এডমিন পেজে ঢুকতে গোপন পিন লিখুন:</p>
            <input type="password" id="adminPin" placeholder="পিন লিখুন (Default: 1234)" class="w-full p-2.5 border rounded-xl text-sm">
            <button onclick="loginAdmin()" class="bg-blue-600 text-white text-sm px-4 py-2 rounded-xl font-bold">প্রবেশ করুন</button>
        </div>

        <!-- Dashboard -->
        <div id="adminContent" class="hidden space-y-8">
            <div class="flex bg-slate-100 p-1 rounded-xl">
                <button onclick="switchAdminTab('students')" id="tabStudentsBtn" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow">পেমেন্ট রিকোয়েস্ট</button>
                <button onclick="switchAdminTab('aiGenerator')" id="tabAiBtn" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600">✨ AI প্রশ্ন জেনারেটর</button>
            </div>

            <!-- Tab 1: Students -->
            <div id="tabStudentsSection" class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-slate-700">আবেদনকারীদের তালিকা</h2>
                    <button onclick="loadStudents()" class="bg-blue-100 text-blue-700 text-xs px-3 py-1.5 rounded-lg font-bold">রিফ্রেশ করুন</button>
                </div>
                <div id="studentList" class="space-y-3"><p class="text-xs text-slate-400">লোডিং...</p></div>
            </div>

            <!-- Tab 2: AI Question Generator -->
            <div id="tabAiSection" class="hidden space-y-6">
                <h2 class="font-bold text-slate-700 text-lg border-b pb-2">বোর্ড স্ট্যান্ডার্ড AI প্রশ্ন জেনারেটর</h2>
                
                <form onsubmit="generateAiQuestions(event)" class="space-y-4 bg-slate-50 p-4 rounded-xl border">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">পরীক্ষার বিষয় ও অধ্যায়</label>
                        <input type="text" id="subjectTitle" required placeholder="যেমন: রসায়ন (৩য় অধ্যায়)" class="w-full p-2.5 border rounded-xl text-sm bg-white">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">অধ্যায়/বইয়ের মূল বিবরণ বা নির্দেশিকা</label>
                        <textarea id="bookContext" rows="3" required placeholder="টপিক বা বইয়ের অংশ লিখুন..." class="w-full p-2.5 border rounded-xl text-sm bg-white"></textarea>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">প্রশ্ন সংখ্যা</label>
                            <input type="number" id="qCount" value="15" min="1" max="30" class="w-full p-2 border rounded-xl text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">সময় (মিনিট)</label>
                            <input type="number" id="timeLimit" value="25" min="1" class="w-full p-2 border rounded-xl text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">মার্কস/প্রশ্ন</label>
                            <input type="number" id="marksPerQ" value="1" step="0.5" class="w-full p-2 border rounded-xl text-sm bg-white">
                        </div>
                    </div>

                    <button type="submit" id="btnGenerate" class="w-full bg-purple-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-purple-700 transition">
                        ✨ বোর্ড মানের প্রশ্ন তৈরি করুন
                    </button>
                </form>

                <!-- Review Container -->
                <div id="reviewContainer" class="hidden space-y-4 bg-amber-50 p-4 rounded-xl border border-amber-200">
                    <div class="flex justify-between items-center border-b border-amber-200 pb-2">
                        <h3 class="font-bold text-amber-900 text-sm">AI জেনারেটেড প্রশ্ন (রিভিউ ও এডিট করুন)</h3>
                        <span id="genCountBadge" class="bg-amber-200 text-amber-800 text-xs px-2 py-0.5 rounded-full font-bold"></span>
                    </div>

                    <div id="aiQuestionsList" class="space-y-4"></div>

                    <button onclick="saveApprovedQuestions()" id="btnSaveFinal" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl text-sm hover:bg-green-700 transition">
                        সব চেক করেছি - ফায়ারবেসে সেভ করুন
                    </button>
                </div>

                <div class="mt-6">
                    <h3 class="font-bold text-slate-700 text-sm mb-3">ডাটাবেজে সেভ থাকা বিষয়সমূহ</h3>
                    <div id="examList" class="space-y-3"><p class="text-xs text-slate-400">লোডিং...</p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBbN4F7Ys23miaMZZR9Xf8NCgBahsTw6BI",
            authDomain: "mcqexm.firebaseapp.com",
            projectId: "mcqexm",
            storageBucket: "mcqexm.firebasestorage.app",
            messagingSenderId: "232482881612",
            appId: "1:232482881612:web:dc976b8f66e03c2480b4e9",
            measurementId: "G-5W6KJQZWW8"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let generatedQuestionsData = [];

        function loginAdmin() {
            const pin = document.getElementById('adminPin').value;
            if(pin === '1234') {
                document.getElementById('pinBox').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                loadStudents();
                loadExams();
            } else { alert("ভুল পিন!"); }
        }

        function switchAdminTab(type) {
            if(type === 'students') {
                document.getElementById('tabStudentsSection').classList.remove('hidden');
                document.getElementById('tabAiSection').classList.add('hidden');
                document.getElementById('tabStudentsBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow";
                document.getElementById('tabAiBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600";
            } else {
                document.getElementById('tabStudentsSection').classList.add('hidden');
                document.getElementById('tabAiSection').classList.remove('hidden');
                document.getElementById('tabAiBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-blue-600 shadow";
                document.getElementById('tabStudentsBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600";
            }
        }

        function loadStudents() {
            const list = document.getElementById('studentList');
            db.collection('students').get().then(snapshot => {
                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const status = data.status || 'pending';
                    html += `
                        <div class="border p-4 rounded-xl flex items-center justify-between bg-slate-50 shadow-sm">
                            <div>
                                <h3 class="font-bold text-sm text-slate-800">${data.name || 'নাম নেই'} (${status})</h3>
                                <p class="text-xs text-slate-600">ফোন: ${data.phone || doc.id}</p>
                                <p class="text-xs text-blue-600 font-mono">TrxID: ${data.trxId || 'নেই'}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="updateStatus('${doc.id}', 'approved')" class="bg-green-600 text-white text-xs px-3 py-1.5 rounded-lg">Approve</button>
                                <button onclick="updateStatus('${doc.id}', 'rejected')" class="bg-red-600 text-white text-xs px-3 py-1.5 rounded-lg">Reject</button>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html || "<p class='text-xs text-slate-500'>কোনো আবেদন নেই।</p>";
            });
        }

        function updateStatus(docId, status) {
            db.collection('students').doc(docId).update({ status: status }).then(() => loadStudents());
        }

        async function generateAiQuestions(e) {
            e.preventDefault();
            const subject = document.getElementById('subjectTitle').value.trim();
            const context = document.getElementById('bookContext').value.trim();
            const qCount = parseInt(document.getElementById('qCount').value);
            const btn = document.getElementById('btnGenerate');

            btn.disabled = true;
            btn.innerText = "⏳ AI প্রশ্ন তৈরি করছে...";

            const prompt = `You are an expert SSC 2027 MCQ question maker following NCTB Bangladesh curriculum.
Generate ${qCount} MCQs in Bengali based on this info/topic: "${context}".
Include:
- Knowledge and application level questions
- Poly-statement questions (বহুপদী সমাপ্তিসূচক প্রশ্ন)

Respond ONLY with a valid JSON array, no extra commentary or markdown syntax.
Format:
[
  {
    "q": "প্রশ্নটি এখানে লিখুন",
    "options": ["ক. অপশন ১", "খ. অপশন ২", "গ. অপশন ৩", "ঘ. অপশন ৪"],
    "ans": 0
  }
]`;

            try {
                const apiKey = firebaseConfig.apiKey;
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const resData = await response.json();

                // Safe parsing logic
                if (!resData.candidates || !resData.candidates[0] || !resData.candidates[0].content) {
                    if (resData.error) throw new Error(resData.error.message);
                    throw new Error("AI থেকে কোনো উত্তর পাওয়া যায়নি। কিছুক্ষণ পর আবার চেষ্টা করুন।");
                }

                let replyText = resData.candidates[0].content.parts[0].text;
                
                // Extract only the JSON array [] part safely
                const jsonMatch = replyText.match(/\[\s*\{[\s\S]*\}\s*\]/);
                if (jsonMatch) {
                    replyText = jsonMatch[0];
                } else {
                    replyText = replyText.replace(/```json|```/g, '').trim();
                }

                generatedQuestionsData = JSON.parse(replyText);
                renderQuestionsForReview();

            } catch (err) {
                alert("প্রশ্ন তৈরিতে ত্রুটি ঘটেছে: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "✨ বোর্ড মানের প্রশ্ন তৈরি করুন";
            }
        }

        function renderQuestionsForReview() {
            const container = document.getElementById('aiQuestionsList');
            document.getElementById('reviewContainer').classList.remove('hidden');
            document.getElementById('genCountBadge').innerText = `${generatedQuestionsData.length}টি প্রশ্ন তৈরি হয়েছে`;

            let html = "";
            generatedQuestionsData.forEach((qObj, index) => {
                html += `
                    <div class="bg-white p-3 rounded-xl border border-amber-200 text-xs space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-800">প্রশ্ন ${index + 1}:</span>
                            <button onclick="removeQuestion(${index})" class="text-red-500 font-bold hover:underline">ডিলিট</button>
                        </div>
                        <textarea onchange="generatedQuestionsData[${index}].q = this.value" class="w-full p-2 border rounded-lg font-semibold text-slate-800" rows="2">${qObj.q}</textarea>
                        <div class="grid grid-cols-2 gap-2">
                            ${qObj.options.map((opt, oIdx) => `
                                <div>
                                    <label class="text-[10px] text-slate-500">অপশন ${oIdx+1}${qObj.ans === oIdx ? '✅' : ''}</label>
                                    <input type="text" value="${opt}" onchange="generatedQuestionsData[${index}].options[${oIdx}] = this.value" class="w-full p-1.5 border rounded-lg ${qObj.ans === oIdx ? 'bg-green-50 font-bold border-green-500' : ''}">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function removeQuestion(index) {
            generatedQuestionsData.splice(index, 1);
            renderQuestionsForReview();
        }

        async function saveApprovedQuestions() {
            if(generatedQuestionsData.length === 0) return alert("কোনো প্রশ্ন নেই!");

            const subjectTitle = document.getElementById('subjectTitle').value.trim();
            const timeLimit = parseInt(document.getElementById('timeLimit').value) || 25;
            const marksPerQ = parseFloat(document.getElementById('marksPerQ').value) || 1;

            const docId = subjectTitle.replace(/\s+/g, '_');
            await db.collection('exams').doc(docId).set({
                setNo: Date.now().toString().slice(-4),
                title: subjectTitle,
                timeLimit: timeLimit,
                marksPerQ: marksPerQ,
                questions: generatedQuestionsData,
                updatedAt: new Date()
            });

            alert(`"${subjectTitle}" বিষয়ের পরীক্ষাটি সফলভাবে ফায়ারবেসে সেভ করা হয়েছে!`);
            document.getElementById('reviewContainer').classList.add('hidden');
                loadExams();
        }

        function loadExams() {
            const list = document.getElementById('examList');
            db.collection('exams').get().then(snapshot => {
                if(snapshot.empty) {
                    list.innerHTML = "<p class='text-xs text-slate-400'>ডাটাবেজে কোনো বিষয় সেভ নেই।</p>";
                    return;
                }
                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const qCount = data.questions ? data.questions.length : 0;
                    html += `
                        <div class="p-3 bg-slate-50 border rounded-xl flex justify-between items-center text-xs">
                            <div>
                                <span class="font-bold text-slate-800 text-sm">${data.title}</span>
                                <p class="text-slate-500 mt-0.5">সময়: ${data.timeLimit} মিনিট | প্রশ্ন: ${qCount} টি | নম্বর/প্রশ্ন: ${data.marksPerQ}</p>
                            </div>
                            <button onclick="deleteExam('${doc.id}')" class="text-red-500 hover:underline font-bold">মুছে ফেলুন</button>
                        </div>
                    `;
                });
                list.innerHTML = html;
            });
        }

        function deleteExam(id) {
            if(confirm("আপনি কি এই বিষয়টি মুছে ফেলতে চান?")) {
                db.collection('exams').doc(id).delete().then(() => loadExams());
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamPrep - এডমিন প্যানেল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl p-6 shadow-md">
        <h1 class="text-2xl font-bold text-slate-800 mb-4 border-b pb-2">পেমেন্ট ম্যানেজমেন্ট (Admin)</h1>

        <!-- PIN Protection -->
        <div id="pinBox" class="space-y-3">
            <p class="text-sm text-slate-600">এডমিন পেজে ঢুকতে গোপন পিন লিখুন:</p>
            <input type="password" id="adminPin" placeholder="পিন লিখুন (Default: 1234)" class="w-full p-2.5 border rounded-xl text-sm">
            <button onclick="loginAdmin()" class="bg-blue-600 text-white text-sm px-4 py-2 rounded-xl">প্রবেশ করুন</button>
        </div>

        <!-- Student Requests List -->
        <div id="adminContent" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-slate-700">আবেদনকারীদের তালিকা</h2>
                <button onclick="loadStudents()" class="bg-blue-100 text-blue-700 text-xs px-3 py-1.5 rounded-lg font-bold">রিফ্রেশ করুন</button>
            </div>

            <div id="studentList" class="space-y-3 mt-3">
                <p class="text-xs text-slate-400">লোডিং...</p>
            </div>
        </div>
    </div>

    <script>
        // আপনার ফায়ারবেস কনফিগারেশন এখানে বসানো আছে (বা আপনার আসল কনফিিগ বসাবেন)
        const firebaseConfig = {
            apiKey: "AIzaSyBbN4F7Ys23miaMZZR9Xf8NCgBahsTw6BI",
            authDomain: "mcqexm.firebaseapp.com",
            projectId: "mcqexm",
            storageBucket: "mcqexm.firebasestorage.app",
            messagingSenderId: "232482881612",
            appId: "1:232482881612:web:dc976b8f66e03c2480b4e9",
            measurementId: "G-5W6KJQZWW8"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function loginAdmin() {
            const pin = document.getElementById('adminPin').value;
            if(pin === '1234') {
                document.getElementById('pinBox').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                loadStudents();
            } else {
                alert("ভুল পিন নম্বর!");
            }
        }

        function loadStudents() {
            const list = document.getElementById('studentList');
            list.innerHTML = "<p class='text-xs text-slate-400'>ডাটা লোড হচ্ছে...</p>";

            db.collection('students').get().then(snapshot => {
                if(snapshot.empty) {
                    list.innerHTML = "<p class='text-xs text-slate-500'>কোনো আবেদন পাওয়া যায়নি।</p>";
                    return;
                }

                let html = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const docId = doc.id; // ডকুমেন্টের আইডি বা ফোন নম্বর
                    const studentName = data.name || 'নাম নেই';
                    const studentPhone = data.phone || docId;
                    const trxId = data.trxId || 'নেই';
                    const status = data.status || 'pending';

                    let statusBadge = status === 'approved' 
                        ? '<span class="bg-green-100 text-green-700 text-xs px-2.5 py-1 rounded-full font-bold">Approved</span>' 
                        : (status === 'rejected' ? '<span class="bg-red-100 text-red-700 text-xs px-2.5 py-1 rounded-full font-bold">Rejected</span>' : '<span class="bg-amber-100 text-amber-700 text-xs px-2.5 py-1 rounded-full font-bold">Pending</span>');

                    html += `
                        <div class="border p-4 rounded-xl flex items-center justify-between bg-slate-50 shadow-sm">
                            <div>
                                <h3 class="font-bold text-sm text-slate-800">${studentName} &nbsp; ${statusBadge}</h3>
                                <p class="text-xs text-slate-600 mt-1">ফোন: <span class="font-semibold">${studentPhone}</span></p>
                                <p class="text-xs text-blue-600 font-mono mt-0.5">TrxID: ${trxId}</p>
                            </div>
                            <div class="flex gap-2">
                                ${status === 'pending' ? `
                                    <button onclick="updateStatus('${docId}', 'approved')" class="bg-green-600 text-white text-xs px-3 py-2 rounded-lg font-bold hover:bg-green-700">Approve</button>
                                    <button onclick="updateStatus('${docId}', 'rejected')" class="bg-red-600 text-white text-xs px-3 py-2 rounded-lg font-bold hover:bg-red-700">Reject</button>
                                ` : `
                                    <button onclick="updateStatus('${docId}', 'pending')" class="bg-slate-300 text-slate-700 text-xs px-3 py-2 rounded-lg font-semibold">Reset</button>
                                `}
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            }).catch(err => {
                list.innerHTML = `<p class='text-xs text-red-500'>ত্রুটি: ${err.message}</p>`;
            });
        }

        function updateStatus(docId, status) {
            db.collection('students').doc(docId).update({ status: status }).then(() => {
                alert("স্ট্যাটাস সফলভাবে আপডেট করা হয়েছে!");
                loadStudents();
            }).catch(err => {
                alert("আপডেট ব্যর্থ: " + err.message);
            });
        }
    </script>
</body>
</html>
